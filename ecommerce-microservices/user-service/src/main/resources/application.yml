server:
  port: 8081

spring:
  application:
    name: user-service
  config:
    import: "optional:configserver:http://localhost:8888"
  datasource:
    url: jdbc:postgresql://localhost:5432/userdb
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

# Local fallback if config-server is unreachable (see spring.config.import
# above — it's "optional:", so the app still boots and needs a default here).
# The REAL value used when config-server IS up comes from config-repo/application.yml,
# and it must match gateway-service's value exactly either way.
app:
  jwt:
    secret: "ecommerce-demo-super-secret-key-change-me-before-any-real-deployment-32bytes+"
    expiration-ms: 3600000

management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh
